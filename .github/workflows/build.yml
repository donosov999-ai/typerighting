name: Build desktop bundles (macOS + Windows + Linux)

# Триггер: только теги v* + ручной запуск. Сборку на каждый push в main
# (как в psygames-native) убрали: репо приватный, macOS-минуты Actions ×10.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Cargo network hardening — крейты с crates.io иногда падают на
  # "curl [16] HTTP2 framing layer" (флейки HTTP/2). Отключаем мультиплексинг
  # (→ HTTP/1.1) + ретраи. Паттерн проверен на psygames-native.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  NODE_VERSION: '22'
  # Подпись апдейтов (tauri-plugin-updater). Приватный ключ в secret, пароль пустой.
  # createUpdaterArtifacts=true → рядом с бандлами генерятся *.sig, из них собирается latest.json.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

jobs:
  # ─── Тесты движка печати (vitest) — гейт: провал блокирует сборку ──────
  test:
    name: Тесты движка (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Run tests
        run: npm test

  # ─── macOS universal (Intel + Apple Silicon) ──────────────────────────
  macos-arm:
    name: macOS universal (Intel + Apple Silicon)
    runs-on: macos-latest
    needs: test
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-universal-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install deps
        run: npm ci

      - name: Clean stale bundle (cached target)
        run: rm -rf src-tauri/target/universal-apple-darwin/release/bundle

      # createUpdaterArtifacts → генерит TypeRIGHTing.app.tar.gz + .sig (подписанный updater-бандл)
      - name: Build .app + .dmg + updater (universal)
        run: npx tauri build --target universal-apple-darwin

      - name: Upload updater artifact (.app.tar.gz + .sig)
        uses: actions/upload-artifact@v4
        with:
          name: TypeRIGHTing-macos-universal-updater
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 30

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeRIGHTing-macos-universal-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30

  # ─── Windows x86_64 ────────────────────────────────────────────────────
  windows-x64:
    name: Windows x86_64 (.exe + .msi)
    runs-on: windows-latest
    needs: test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-win-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install deps
        run: npm ci

      - name: Clean stale bundle (cached target)
        shell: bash
        run: rm -rf src-tauri/target/x86_64-pc-windows-msvc/release/bundle

      - name: Build .exe + .msi + updater
        run: npx tauri build --target x86_64-pc-windows-msvc

      # NSIS .exe — установщик для прямого скачивания И updater-цель (Tauri подписывает его .sig)
      - name: Upload .exe artifact (NSIS setup + .sig)
        uses: actions/upload-artifact@v4
        with:
          name: TypeRIGHTing-windows-x64-exe
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
          retention-days: 30

      - name: Upload .msi artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeRIGHTing-windows-x64-msi
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          retention-days: 30
        continue-on-error: true

  # ─── Linux x86_64 ──────────────────────────────────────────────────────
  linux-x64:
    name: Linux x86_64 (.AppImage + .deb)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (webkit2gtk etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-linux-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install deps
        run: npm ci

      - name: Clean stale bundle (cached target)
        run: rm -rf src-tauri/target/release/bundle

      - name: Build .AppImage + .deb + .rpm + updater
        run: npx tauri build

      # AppImage — updater-цель для Linux (Tauri подписывает .sig)
      - name: Upload .AppImage artifact (+ .sig)
        uses: actions/upload-artifact@v4
        with:
          name: TypeRIGHTing-linux-x64-appimage
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          retention-days: 30

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeRIGHTing-linux-x64-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeRIGHTing-linux-x64-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 30
        continue-on-error: true

  # ─── Create GitHub Release + latest.json (updater manifest) ───────────
  release:
    needs: [macos-arm, windows-x64, linux-x64]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.macos-arm.result == 'success' && needs.windows-x64.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Show artifacts
        run: find artifacts -type f

      # Собираем latest.json для tauri-plugin-updater из .sig-файлов и имён бандлов.
      # url указывают на ассеты этого же релиза (releases/download/<tag>/<file>).
      - name: Build updater manifest (latest.json)
        run: |
          node <<'EOF'
          const fs = require('fs');
          const cp = require('child_process');
          const tag = process.env.GITHUB_REF_NAME;        // v2.56.4
          const ver = tag.replace(/^v/, '');
          const base = `https://github.com/donosov999-ai/typerighting/releases/download/${tag}`;
          const find = (pat) => cp.execSync(`find artifacts -name '${pat}' | head -1`).toString().trim();
          const sig = (p) => (p ? fs.readFileSync(p, 'utf8').trim() : '');
          const name = (p) => (p ? p.split('/').pop() : '');

          const macTgz = find('*.app.tar.gz');
          const macSig = find('*.app.tar.gz.sig');
          const winExe = find('*-setup.exe');
          const winSig = find('*-setup.exe.sig');
          const linAi  = find('*.AppImage');
          const linSig = find('*.AppImage.sig');

          const platforms = {};
          if (macTgz && macSig) {
            const p = { signature: sig(macSig), url: `${base}/${name(macTgz)}` };
            platforms['darwin-x86_64'] = p;       // universal .app.tar.gz покрывает обе арки
            platforms['darwin-aarch64'] = p;
          }
          if (winExe && winSig) platforms['windows-x86_64'] = { signature: sig(winSig), url: `${base}/${name(winExe)}` };
          if (linAi && linSig)  platforms['linux-x86_64']   = { signature: sig(linSig), url: `${base}/${name(linAi)}` };

          const manifest = {
            version: ver,
            notes: `TypeRIGHTing ${ver}. Подробнее — в описании релиза.`,
            pub_date: new Date().toISOString(),
            platforms,
          };
          fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
          console.log('latest.json:\n', JSON.stringify(manifest, null, 2));
          if (Object.keys(platforms).length === 0) { console.error('НЕТ платформ — .sig не найдены, апдейтер не заработает'); process.exit(1); }
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            latest.json
            artifacts/TypeRIGHTing-macos-universal-updater/*.app.tar.gz
            artifacts/TypeRIGHTing-macos-universal-updater/*.app.tar.gz.sig
            artifacts/TypeRIGHTing-macos-universal-dmg/*.dmg
            artifacts/TypeRIGHTing-windows-x64-exe/*.exe
            artifacts/TypeRIGHTing-windows-x64-exe/*.sig
            artifacts/TypeRIGHTing-windows-x64-msi/*.msi
            artifacts/TypeRIGHTing-linux-x64-appimage/*.AppImage
            artifacts/TypeRIGHTing-linux-x64-appimage/*.AppImage.sig
            artifacts/TypeRIGHTing-linux-x64-deb/*.deb
            artifacts/TypeRIGHTing-linux-x64-rpm/*.rpm
          generate_release_notes: true
          fail_on_unmatched_files: false
