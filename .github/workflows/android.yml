name: Build Android APK (debug / sideload)

# Отдельно от build.yml (десктоп на тегах v*). Пока — ручной запуск: итерируем
# Android без релиз-тегов. Даёт debug-подписанный APK (ставится на устройство
# сайдлоадом). Подпись релиз-ключом + AAB для Google Play — отдельной фазой.
# Тулчейн-рецепт снят с рабочей Android-сборки psygames (NDK 27, platform 34).
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Флейки HTTP/2 crates.io → HTTP/1.1 + ретраи (паттерн проверен на psygames)
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  NODE_VERSION: '22'

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # platform 34 + build-tools 34 + NDK 27 (r27 выравнивает 16 КБ page-size —
      # это hard-блокер Google Play, ловили на psygames; для debug-сайдлоада не
      # критично, но берём сразу правильный NDK)
      - name: Setup Android SDK (platform 34 + NDK 27)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973'

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install deps
        run: npm ci

      # Скаффолд gen/android (не коммитим — генерится в CI, как у psygames)
      - name: Initialize Tauri Android project
        run: npx tauri android init

      # beforeBuildCommand (npm run build) → dist (vite base './') упаковывается в APK.
      # --debug → debug-подписанный APK, ставится сайдлоадом без релиз-ключа.
      - name: Build debug APK
        run: npx tauri android build --apk --debug

      - name: Locate + smoke-check APK
        run: |
          APK=$(find src-tauri/gen/android -name "*.apk" -path "*debug*" | head -1)
          [ -z "$APK" ] && APK=$(find src-tauri/gen/android -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "🔴 APK не собрался"; find src-tauri/gen/android -name "*.apk" -o -name "*.aab"; exit 1; fi
          echo "✅ APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeRIGHT-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
