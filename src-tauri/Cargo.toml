[package]
name = "typerighting"
version = "2.25.0"
description = "TypeRIGHTing — touch typing trainer (EN + RU), desktop build"
authors = ["Denis Onosov (ODV999)"]
edition = "2021"

[lib]
name = "typerighting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
