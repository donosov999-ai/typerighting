name: typefree_flutter_foundation
description: Private local foundation for the TypeFree Flutter migration.
publish_to: none
version: 0.0.0+1
environment:
  sdk: ">=3.13.4 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  crypto: 3.0.7
  path_provider: 2.1.6
  shared_preferences: 2.5.5
  web: 1.1.1
  synapse_pet:
    git:
      url: https://github.com/donosov999-ai/mascot-engine.git
      ref: 1de61172fc20788c57d2bd030787ff6fedf8d1e8
      path: packages/synapse_pet
  file_picker: 13.1.0
  audioplayers: 6.8.1
  webview_flutter: 4.14.1
  # Teacher cabinet (ecosystem.coach/2): vendored shared packages, see ../packages/PIN.md.
  ecosystem_account:
    path: ../packages/ecosystem_account
  ecosystem_coach:
    path: ../packages/ecosystem_coach
  flutter_secure_storage: 11.2.0
  app_links: 7.2.2
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/templates/registry.json
    - assets/baseline/
    - assets/content/
    - assets/artwork/
    - assets/learning/
    - assets/voice/ru/
    - assets/voice/en/
  fonts:
    - family: PT Mono
      fonts:
        - asset: assets/fonts/PTMono-Regular.ttf

