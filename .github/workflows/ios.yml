name: Build iOS (simulator / TestFlight)

# Рецепт снят с рабочей iOS-сборки psygames (02–04.09.2026): те же грабли Apple,
# те же скрипты-патчи. ГЛАВНОЕ ОТЛИЧИЕ — модель подписи: psygames СОЗДАЁТ сертификат
# и отзывает старые (KEEP=1), а сертификаты распространения общие на весь аккаунт.
# TypeRIGHT делит аккаунт Apple с psygames, поэтому здесь сертификат ИМПОРТИРУЕТСЯ из
# секрета (общий .p12), а заводится только свой профиль — чужой сертификат не
# трогается (см. scripts/ios-provision-profile.py и IOS_SETUP.md).
#
# Стек TypeRIGHT — vanilla Vite (не Expo): фронт собирает сам tauri через
# beforeBuildCommand=`npm run build` (frontendDist=../dist, base './'), поэтому
# отдельных шагов «expo export» + «move dist» из psygames здесь нет.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  NODE_VERSION: '22'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Симуляторная сборка: доказывает, что iOS-таргет компилится. Секретов НЕ требует,
  # поэтому зелёная и до оплаты/ключей Apple. На устройство НЕ ставится (нужна подпись).
  ios-sim:
    name: iOS (симулятор, без подписи)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust + iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-ios-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install Tauri CLI + CocoaPods
        run: |
          cargo install tauri-cli --version "^2.0" --locked || true
          brew install cocoapods

      - name: Install deps
        run: npm ci

      - name: Initialize iOS project
        run: npx tauri ios init

      - name: Build for simulator
        run: npx tauri ios build --target aarch64-sim --debug
        # continue-on-error: пока настраиваем — не валим весь workflow из-за симулятора
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────────────
  # Подписанная сборка → TestFlight (реальный iPhone/iPad с Bluetooth-клавиатурой).
  # 🔴 ТОЛЬКО ОДНА iOS-ПОДПИСЬ ЗА РАЗ. Даже импорт-модель безопаснее вести по одной:
  # concurrency держит сборки в очереди, а не отменяет (отменённая версия молча
  # пропала бы, не доехав до TestFlight).
  ios-release:
    name: iOS (подписанная → TestFlight)
    concurrency:
      group: ios-signing
      cancel-in-progress: false
    # Ручной запуск проверяет сборку .ipa без выкладки; публикует только тег v*.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Без секретов подпись невозможна — джоба тихо no-op (как android-test до ключей).
      - name: Есть ли ключи Apple
        id: keys
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ] && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=iOS::Секретов Apple нет — подписанная сборка пропущена (см. IOS_SETUP.md)."
          fi

      - name: Setup Node
        if: steps.keys.outputs.ready == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust + iOS target
        if: steps.keys.outputs.ready == 'yes'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install Tauri CLI + CocoaPods + xcodegen
        if: steps.keys.outputs.ready == 'yes'
        run: |
          cargo install tauri-cli --version "^2.0" --locked || true
          brew install cocoapods xcodegen

      - name: Install deps
        if: steps.keys.outputs.ready == 'yes'
        run: npm ci

      # Ключ API кладём туда, где его ищут скрипты подписи и профиля; стираем в конце.
      - name: Разложить ключ API
        if: steps.keys.outputs.ready == 'yes'
        env:
          KEY: ${{ secrets.APPLE_API_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8

      - name: Init iOS project
        if: steps.keys.outputs.ready == 'yes'
        run: npx tauri ios init

      # Импорт общего сертификата (.p12) + WWDR + создание СВОЕГО профиля.
      # Сертификаты аккаунта не создаются и не отзываются — psygames не задет.
      - name: Подпись — импорт общего сертификата + профиль TypeRIGHT
        if: steps.keys.outputs.ready == 'yes'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: bash scripts/ios-signing-setup.sh

      # Патч сгенерированного проекта: ручная подпись, профиль, -lapp, iOS 15,
      # ответ про экспортное шифрование. gen/ в .gitignore — патчим каждый раз.
      - name: Патч проекта (подпись, линковка, iOS 15)
        if: steps.keys.outputs.ready == 'yes'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 scripts/ios-project-patch.py --team "$TEAM" --profile "TypeRIGHT App Store"

      # Архив ВЕДЁТ tauri: фаза «Build Rust Code» работает только под ним (иначе падает
      # на отсутствующем addr-файле веб-сокет-сервера). Останавливаемся на архиве —
      # экспорт делаем своим plist (в нём соответствие идентификатор→профиль).
      - name: Архив (ведёт tauri)
        if: steps.keys.outputs.ready == 'yes'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          CI: 'true'
        run: npx tauri ios build --archive-only

      - name: Export .ipa
        if: steps.keys.outputs.ready == 'yes'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ARCHIVE=$(find src-tauri/gen/apple -name '*.xcarchive' -maxdepth 4 | head -1)
          if [ -z "$ARCHIVE" ]; then echo "::error title=iOS::.xcarchive не найден"; exit 1; fi
          echo "архив: $ARCHIVE"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.odv999.typerighting</key><string>TypeRIGHT App Store</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        if: steps.keys.outputs.ready == 'yes' && startsWith(github.ref, 'refs/tags/v')
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          IPA=$(find "$RUNNER_TEMP/ipa" src-tauri/gen/apple/build -name '*.ipa' 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then echo "::error title=iOS::.ipa не найден"; exit 1; fi
          # Сначала ВАЛИДАЦИЯ (ловит структурные ошибки бандла, код 90171) — дешевле,
          # чем узнать об отказе письмом через полчаса после загрузки.
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      # Внешнее ревью — отдельный шаг: без него загрузка не доходит до внешних
      # тестировщиков (замер psygames 03.09.2026).
      - name: Подать на внешнее ревью TestFlight
        if: steps.keys.outputs.ready == 'yes' && startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_BUNDLE_ID: com.odv999.typerighting
        run: node .github/scripts/testflight-external.mjs
        continue-on-error: true

      - name: Стереть ключ
        if: always() && steps.keys.outputs.ready == 'yes'
        run: rm -rf ~/private_keys
