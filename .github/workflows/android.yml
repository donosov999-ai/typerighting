name: Build Android APK (debug / sideload)

# Отдельно от build.yml (десктоп на тегах v*). Пока — ручной запуск: итерируем
# Android без релиз-тегов. Даёт debug-подписанный APK (ставится на устройство
# сайдлоадом). Подпись релиз-ключом + AAB для Google Play — отдельной фазой.
# Тулчейн-рецепт снят с рабочей Android-сборки psygames (NDK 27, platform 34).
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Флейки HTTP/2 crates.io → HTTP/1.1 + ретраи (паттерн проверен на psygames)
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  NODE_VERSION: '22'

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # публикация APK в rolling pre-release android-test
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # platform 34 + build-tools 34 + NDK 27 (r27 выравнивает 16 КБ page-size —
      # это hard-блокер Google Play, ловили на psygames; для debug-сайдлоада не
      # критично, но берём сразу правильный NDK)
      - name: Setup Android SDK (platform 34 + NDK 27)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973'

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install deps
        run: npm ci

      # Скаффолд gen/android (не коммитим — генерится в CI, как у psygames)
      - name: Initialize Tauri Android project
        run: npx tauri android init

      # Тест-ключ подписи (НЕ Play-релиз): генерим в CI, чтобы release-APK ставился
      # сайдлоадом. ⚠️ Ключ новый на каждую сборку → обновление поверх требует
      # переустановки. Стабильный Play-ключ — Фаза 3.
      - name: Generate test signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/typeright-test.jks" \
            -storepass typeright -keypass typeright -alias typeright \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=TypeRIGHT Test, O=ODV999, C=RU"

      - name: Patch build.gradle.kts (sign release with test key)
        run: |
          GRADLE=src-tauri/gen/android/app/build.gradle.kts
          [ -f "$GRADLE" ] || { echo "🔴 нет $GRADLE после init"; find src-tauri/gen/android -name 'build.gradle*'; exit 1; }
          cat >> "$GRADLE" <<'EOF'

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes { getByName("release") { signingConfig = signingConfigs.getByName("release") } }
          }
          EOF

      # RELEASE (strip=true, opt-level=s, lto из [profile.release]) → APK в разы меньше
      # debug (433 МБ → ~30–70 МБ). beforeBuildCommand=npm run build даёт dist (vite base './').
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/typeright-test.jks
          ANDROID_KEYSTORE_PASSWORD: typeright
          ANDROID_KEY_ALIAS: typeright
          ANDROID_KEY_PASSWORD: typeright
          # тест-сборка → включает встроенный багфикс (кнопка «Сообщить о баге»); публичный веб-билд его не имеет
          VITE_TEST_BUILD: '1'
        run: npx tauri android build --apk

      - name: Locate + smoke-check APK
        run: |
          APK=$(find src-tauri/gen/android -name "*-release*.apk" ! -name "*unsigned*" | head -1)
          [ -z "$APK" ] && APK=$(find src-tauri/gen/android -name "*.apk" ! -name "*unsigned*" | head -1)
          if [ -z "$APK" ]; then echo "🔴 APK не собрался"; find src-tauri/gen/android -name "*.apk"; exit 1; fi
          SZ=$(du -m "$APK" | cut -f1)
          echo "✅ APK: $APK (${SZ} МБ)"
          if [ "$SZ" -gt 200 ]; then echo "⚠️ APK ${SZ}МБ — подозрительно много для release (ждали <100)"; fi
          # стабильное имя → стабильная ссылка на сайте
          cp "$APK" TypeRIGHT-android.apk

      - name: Upload APK artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: TypeRIGHT-android-debug-apk
          path: TypeRIGHT-android.apk
          retention-days: 30

      # Публичный прямой линк для сайта: rolling pre-release с фиксированным тегом.
      # Тег + имя файла стабильны → ссылка на typefree.pro не меняется между сборками.
      - name: Publish APK to android-test pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: "TypeRIGHT — Android (тестовая сборка)"
          prerelease: true
          fail_on_unmatched_files: true
          files: TypeRIGHT-android.apk
          body: |
            Тестовая Android-сборка (debug, сайдлоад). Один APK для телефона и планшета.
            ⚠️ Для тренажёра слепой печати нужна Bluetooth-клавиатура.
            Обновляется автоматически при каждой сборке.
